<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuel Route Calculator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{font-family:Arial,sans-serif;margin:0;background:#eef8f5;color:#173d38}
.wrap{padding:16px;max-width:700px;margin:auto}.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h2{margin-top:0}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #b9d5cf;border-radius:10px;margin:5px 0 9px;font-size:16px}
button{border:0;border-radius:11px;padding:12px 15px;margin:4px;font-size:15px;background:#087f68;color:white;font-weight:bold}
button.alt{background:#dfeeea;color:#075e50}.result{padding:12px;background:#f1faf7;border-radius:12px;margin:8px 0}.big{font-size:20px;font-weight:bold}.muted{color:#617a75;font-size:13px}
#map{height:390px;border-radius:14px;margin-top:10px}.routeBtn{width:100%;text-align:left;background:#e9f6f2;color:#075e50}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h2>⛽ မြို့ ၅ နေရာ Fuel Calculator</h2>
<div id="inputs"></div>
<div class="result"><b>⛽ ဆီစားနှုန်း သတ်မှတ်ပါ</b><div class="muted">ဥပမာ — 9 မိုင်မှာ 2 ဂါလံဆို 9 နဲ့ 2 ထည့်ပါ</div><input id="rateMiles" type="number" min="0.01" step="0.01" value="9" placeholder="မိုင်"><input id="rateGallons" type="number" min="0.01" step="0.01" value="2" placeholder="ဂါလံ"></div><button onclick="addCity()">＋ မြို့ထည့်မယ်</button>
<button onclick="calculate()">တွက်မယ်</button>
<button class="alt" onclick="clearAll()">ရှင်းမယ်</button>
</div>
<div id="status" class="card muted">မြို့များထည့်ပြီး “တွက်မယ်” ကိုနှိပ်ပါ။</div>
<div id="summary" class="card" style="display:none"></div>
<div id="mapCard" class="card" style="display:none"><h3>🗺️ လမ်းကြောင်းမြေပုံ</h3><div id="map"></div></div>
<div id="routes" class="card" style="display:none"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let count=0,map=null,routeLayer=null,markers=[],routeData=[];
const inputs=document.getElementById('inputs');
function addCity(){
 if(count>=5)return;
 count++; const d=document.createElement('div');
 d.innerHTML='<input id="city'+count+'" placeholder="မြို့ '+count+' (ဥပမာ Taunggyi)">';
 inputs.appendChild(d);
}
for(let i=0;i<2;i++)addCity();
function clearAll(){location.reload()}
async function geocode(q){
 const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q+', Myanmar');
 const r=await fetch(u,{headers:{Accept:'application/json'}}); const a=await r.json();
 if(!a.length)throw new Error(q+' ကို ရှာမတွေ့ပါ');
 return {name:q,lat:+a[0].lat,lon:+a[0].lon};
}
async function osrm(a,b){
 const u='https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=full&geometries=geojson';
 const r=await fetch(u); const j=await r.json();
 if(!j.routes||!j.routes[0])throw new Error('လမ်းကြောင်းမတွေ့ပါ');
 return j.routes[0];
}
async function elevation(points){
 const step=Math.max(1,Math.floor(points.length/80));
 const p=[]; for(let i=0;i<points.length;i+=step)p.push(points[i]);
 if(p[p.length-1]!==points[points.length-1])p.push(points[points.length-1]);
 const lat=p.map(x=>x[1].toFixed(6)).join(',');
 const lon=p.map(x=>x[0].toFixed(6)).join(',');
 const u='https://api.open-meteo.com/v1/elevation?latitude='+encodeURIComponent(lat)+'&longitude='+encodeURIComponent(lon);
 const r=await fetch(u);
 if(!r.ok)throw new Error('Elevation data မရပါ');
 const j=await r.json();
 const e=Array.isArray(j)?j.flatMap(x=>x.elevation||[]):(j.elevation||[]);
 if(!Array.isArray(e)||e.length!==p.length)throw new Error('Elevation data မပြည့်စုံပါ');
 return {points:p,elevations:e};
}
function splitMiles(sampled){
 let mountain=0,flat=0;
 const p=sampled.points,e=sampled.elevations;
 for(let i=1;i<p.length;i++){
   const dx=(p[i][0]-p[i-1][0])*111320*Math.cos(((p[i][1]+p[i-1][1])/2)*Math.PI/180);
   const dy=(p[i][1]-p[i-1][1])*111320;
   const m=Math.sqrt(dx*dx+dy*dy);
   const grade=Math.abs((e[i]||0)-(e[i-1]||0))/Math.max(m,1)*100;
   if(grade>=3)mountain+=m; else flat+=m;
 }
 const raw=mountain+flat; return {mountain:raw?mountain/raw:0,flat:raw?flat/raw:0};
}
function mi(m){return m/1609.344}
function fuel(miles){
 const rm=Number(document.getElementById('rateMiles').value);
 const rg=Number(document.getElementById('rateGallons').value);
 if(!(rm>0)||!(rg>0))throw new Error('ဆီစားနှုန်းကို မှန်ကန်စွာထည့်ပါ');
 return miles/rm*rg;
}
function money(n){return Number(n).toFixed(2)}
async function calculate(){
 const names=[...document.querySelectorAll('input[id^="city"]')].map(x=>x.value.trim()).filter(Boolean);
 if(names.length<2){alert('အနည်းဆုံး မြို့ ၂ နေရာထည့်ပါ');return}
 document.getElementById('status').textContent='မြို့များနှင့် လမ်းကြောင်းများ ရှာနေပါတယ်...';
 routeData=[]; 
 try{
  const cities=[]; for(const n of names)cities.push(await geocode(n));
  for(let i=0;i<cities.length;i++)for(let j=i+1;j<cities.length;j++){
    const r=await osrm(cities[i],cities[j]);
    const coords=r.geometry.coordinates;
    const miles=r.distance/1609.344;
    const sf=splitMiles(await elevation(coords));
    routeData.push({a:cities[i],b:cities[j],miles,mountain:miles*sf.mountain,flat:miles*sf.flat,geo:coords});
  }
  routeData.sort((a,b)=>a.miles-b.miles);
  showResults();
 }catch(e){document.getElementById('status').textContent='❌ '+e.message}
}
function showResults(){
 const near=routeData[0],far=routeData[routeData.length-1];
 document.getElementById('status').textContent='တွက်ချက်ပြီးပါပြီ။';
 const box=document.getElementById('summary');box.style.display='block';
 box.innerHTML='<h3>📊 ရလဒ်</h3>'+card('🟢 အနီးဆုံးလမ်း',near)+card('🔴 အဝေးဆုံးလမ်း',far);
 const rr=document.getElementById('routes');rr.style.display='block';
 rr.innerHTML='<h3>📋 စစ်ထားသောလမ်းများ</h3>'+routeData.map((x,i)=>'<button class="routeBtn" onclick="showRoute('+i+')">'+(i===0?'🟢 ':'')+(i===routeData.length-1?'🔴 ':'')+(x.a.name+' → '+x.b.name)+' — '+money(x.miles)+' မိုင်</button>').join('');
 showRoute(0);
}
function card(title,x){
 const g=fuel(x.miles),l=g*3.785411784;
 return '<div class="result"><div class="big">'+title+'</div><div>'+x.a.name+' → '+x.b.name+'</div><div>⛰️ တောင်ပေါ်မိုင်: <b>'+money(x.mountain)+'</b></div><div>🛣️ မြေပြန့်မိုင်: <b>'+money(x.flat)+'</b></div><div>📏 စုစုပေါင်း: <b>'+money(x.miles)+' မိုင်</b></div><div>⛽ ဆီ: <b>'+money(g)+' ဂါလံ</b> / '+money(l)+' L</div><div class="muted">'+money(x.miles)+' ÷ '+money(Number(document.getElementById('rateMiles').value))+' × '+money(Number(document.getElementById('rateGallons').value))+' = '+money(g)+' ဂါလံ</div><button onclick="showRoute('+routeData.indexOf(x)+')">🗺️ ဒီလမ်းကို မြေပုံမှာကြည့်မယ်</button></div>'
}
function initMap(){
 if(map)return;
 map=L.map('map').setView([21.0,96.0],6);
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — © OpenStreetMap contributors'}).addTo(map);
}
function showRoute(i){
 const x=routeData[i]; if(!x)return;
 document.getElementById('mapCard').style.display='block';
 initMap(); setTimeout(()=>map.invalidateSize(),100);
 if(routeLayer)map.removeLayer(routeLayer); markers.forEach(m=>map.removeLayer(m));markers=[];
 const latlngs=x.geo.map(p=>[p[1],p[0]]);
 routeLayer=L.polyline(latlngs,{weight:6}).addTo(map);
 markers.push(L.marker([x.a.lat,x.a.lon]).addTo(map).bindPopup(x.a.name).openPopup());
 markers.push(L.marker([x.b.lat,x.b.lon]).addTo(map).bindPopup(x.b.name));
 map.fitBounds(routeLayer.getBounds(),{padding:[20,20]});
}
</script>
</body>
</html>
