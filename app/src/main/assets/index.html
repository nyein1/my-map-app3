<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>စာ → ဇယား</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f7f6;color:#173d38}.wrap{max-width:800px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}h2{margin-top:0}textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #b9d5cf;border-radius:10px;margin:5px 0 10px;font-size:16px}button{border:0;border-radius:11px;padding:12px 15px;margin:4px;background:#087f68;color:#fff;font-weight:bold}.alt{background:#dfeeea;color:#075e50}.hint{color:#617a75;font-size:13px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:420px}th,td{border:1px solid #bdd2ce;padding:10px;text-align:left}th{background:#e7f4f1}td[contenteditable=true],th[contenteditable=true]{background:#fffdf5}.actions{display:flex;flex-wrap:wrap}</style></head><body><div class="wrap"><div class="card"><h2>📝 စာ → 📊 ဇယား</h2><div class="hint">တစ်ကြောင်းစီရေးပါ။ ကော်မာ (,), | သို့မဟုတ် Tab နဲ့ ကော်လံခွဲထားရင် အလိုအလျောက် ဇယားဖြစ်ပါမယ်။</div><textarea id="input" rows="9" placeholder="အမည်, လီတာ, ဈေးနှုန်း&#10;မောင်မောင်, 10, 5000&#10;ကိုကို, 15, 7500&#10;အောင်အောင်, 20, 10000"></textarea><div class="actions"><button onclick="makeTable()">ဇယားဆွဲမယ်</button><button class="alt" onclick="addRow()">＋ Row</button><button class="alt" onclick="addCol()">＋ Column</button><button class="alt" onclick="copyTable()">Copy</button><button class="alt" onclick="saveTable()">သိမ်းမယ်</button><button class="alt" onclick="clearAll()">ရှင်းမယ်</button></div></div><div class="card" id="out"><div class="hint">ဇယားရလဒ် ဒီနေရာမှာပေါ်ပါမယ်။ Cell ကိုနှိပ်ပြီး တိုက်ရိုက်ပြင်နိုင်ပါတယ်။</div></div></div><script>
function parts(s){let d=s.includes("\t")?"\t":s.includes("|")?"|":",";return s.split(d).map(x=>x.trim())}
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function makeTable(){let lines=document.getElementById("input").value.trim().split(/\n+/).filter(Boolean);if(!lines.length)return;let rows=lines.map(parts),cols=Math.max(...rows.map(r=>r.length));rows=rows.map(r=>{while(r.length<cols)r.push("");return r});let h='<div class="tablewrap"><table id="tbl"><thead><tr>'+rows[0].map(x=>'<th contenteditable="true">'+esc(x)+"</th>").join("")+"</tr></thead><tbody>"+rows.slice(1).map(r=>"<tr>"+r.map(x=>'<td contenteditable="true">'+esc(x)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";document.getElementById("out").innerHTML=h}
function addRow(){let t=document.getElementById("tbl");if(!t)return;let n=t.tHead.rows[0].cells.length,r=t.tBodies[0].insertRow();for(let i=0;i<n;i++){let c=r.insertCell();c.contentEditable="true"}}
function addCol(){let t=document.getElementById("tbl");if(!t)return;let h=document.createElement("th");h.contentEditable="true";h.textContent="Column";t.tHead.rows[0].appendChild(h);[...t.tBodies[0].rows].forEach(r=>{let c=r.insertCell();c.contentEditable="true"})}
function tableText(){let t=document.getElementById("tbl");if(!t)return "";return [...t.rows].map(r=>[...r.cells].map(c=>c.innerText.trim()).join("\t")).join("\n")}
async function copyTable(){let s=tableText();if(!s)return;await navigator.clipboard.writeText(s);alert("ဇယားကို Copy လုပ်ပြီးပါပြီ")}
function saveTable(){let s=tableText();if(!s)return;localStorage.setItem("myTable",s);alert("ဖုန်းထဲမှာ သိမ်းပြီးပါပြီ")}
function clearAll(){document.getElementById("input").value="";document.getElementById("out").innerHTML='<div class="hint">ဇယားရလဒ် ဒီနေရာမှာပေါ်ပါမယ်။</div>'}
let old=localStorage.getItem("myTable");if(old)document.getElementById("input").value=old.split("\n").map(x=>x.split("\t").join(", ")).join("\n");
</script></body></html>
